<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YUKI DREAM - Official</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0f;
      color: #e0e0ff;
      font-family: 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .hero {
      text-align: center;
      padding: 60px 20px;
    }
    h1 {
      font-size: 3rem;
      letter-spacing: 0.3em;
      background: linear-gradient(135deg, #9b59b6, #3498db, #1abc9c);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 1rem;
    }
    .tagline {
      font-size: 1.1rem;
      color: #8899bb;
      letter-spacing: 0.15em;
      margin-bottom: 2.5rem;
    }
    .links {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .btn {
      padding: 12px 28px;
      border: 1px solid #4455aa;
      border-radius: 30px;
      color: #aabbee;
      text-decoration: none;
      font-size: 0.9rem;
      letter-spacing: 0.1em;
      transition: all 0.3s;
    }
    .btn:hover {
      background: #1a1a3a;
      border-color: #7788cc;
      color: #ddeeff;
    }
    footer {
      position: fixed;
      bottom: 20px;
      font-size: 0.75rem;
      color: #334455;
    }
    footer a { color: #445566; text-decoration: none; margin: 0 8px; }
    footer a:hover { color: #667788; }
  </style>
</head>
<body>
  <div class="hero">
    <h1>YUKI DREAM</h1>
    <p class="tagline">Electronic Music &amp; AI Soundscapes</p>
    <div class="links">
      <a class="btn" href="https://www.tiktok.com/@yukihira.1967" target="_blank">TikTok</a>
      <a class="btn" href="https://www.tunecore.co.jp/artists/yukidream" target="_blank">Music</a>
    </div>
  </div>
  <footer>
    <a href="terms.html">Terms of Service</a>
    <a href="privacy.html">Privacy Policy</a>
    &copy; 2026 YUKI DREAM
  </footer>
</body>
</html>
